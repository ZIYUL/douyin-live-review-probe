<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>抖音数据探针</title><link rel="stylesheet" href="popup.css"><body><header><span>LOCAL · RESPONSE PROBE</span><h1>抖音主播中心数据探针 <small>V0.2.1</small></h1></header><p id="page"></p><p id="status">正在读取…</p><div class="actions"><button id="start">开始采集当前标签页</button><button id="stop">停止采集</button></div><div class="actions auto-actions"><button id="auto">自动采集当前直播</button><button id="auto-stop">停止自动采集</button></div><section id="automation"><h2>自动采集进度</h2><p id="auto-state">IDLE</p><div id="auto-progress"></div><pre id="auto-result"></pre></section><p id="error" role="alert"></p><div id="stats"></div><h2>发现接口</h2><div id="list"></div><details><summary>采集规则与大小设置</summary><p>停止后修改；只填写必要业务域名，一行一个。</p><label>业务域名<textarea id="hosts"></textarea></label><label>忽略埋点域名<textarea id="telemetry"></textarea></label><label><input type="checkbox" id="large">允许保存 5–20 MB 正文</label><label>安全 Query 枚举（默认 {}；仅人工审核后填写）<textarea id="safe-query">{}</textarea></label><button id="settings">保存设置</button></details><footer><button id="export">导出诊断包 ZIP</button><button id="clear">清空本次采集</button></footer><p class="note">本地保存 · 无云上传 · 无主动接口请求<br>手动模式开始后请刷新或操作复盘页面。自动模式请先进入当前一场复盘。打开 DevTools 可能中断采集。</p><script type="module" src="popup.js"></script></body></html>
